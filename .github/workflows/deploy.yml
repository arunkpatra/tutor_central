name: deploy

# The one way the database and the API reach production (D21, D26), started by hand, as in the owner's other apps: nothing deploys on its
# own (git deploys are off in api/vercel.json). The commit, by default the head of main, is built on the runner with
# Vercel's CLI, uploaded prebuilt, and smoke-tested at the production domain: /health must report that very commit, the
# AI routes must refuse a request without a token, and the smoke account makes one real call. The run's summary prints
# the one-command rollback. A commit whose check is not green stops at the gate (D80).

run-name: deploy ${{ inputs.commit || 'the head of main' }} to production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of main to deploy (full SHA). Empty, the head of main.
        required: false
        default: ""

# One deploy at a time, queued, never cancelled: a deploy cut in half leaves production between two commits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned: the owner's other apps hold 59.19.0 because 59.20.0 broke --prebuilt on bun's install layout.
  VERCEL_CLI: vercel@59.19.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  SITE: ${{ vars.API_ORIGIN }}

jobs:
  # The gate (D80): a commit whose check is not green never reaches production. A documents-only commit (D31 runs no
  # check) passes on the nearest earlier run when only documents changed since it.
  gate:
    name: the check is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    # The one commit of the run: the migration and the API take it, so a main that moves meanwhile changes nothing.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The commit
        id: commit
        env:
          ASKED: ${{ inputs.commit }}
        run: |
          sha="${ASKED:-$(git rev-parse origin/main)}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::\"$sha\" is not a whole commit SHA."; exit 1; fi
          if ! git merge-base --is-ancestor "$sha" origin/main 2>/dev/null; then echo "::error::$sha is not a commit of main."; exit 1; fi
          git checkout -q "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: The check for the commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: bun tools/check-gate.ts "$SHA"

  # Migrations reach the hosted database only here, before the API (D26). The dry run is the run's record of what was
  # pending; after the push nothing may be pending. A migration is additive while an installed build still uses what
  # it would remove, so the database can lead the app.
  migrate:
    name: the database to production
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: esowihbxawvoexflekxa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The gate's commit
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: git checkout -q "$SHA"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Link
        working-directory: supabase
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # --agent yes: the CLI answers in one JSON line whatever the terminal ("upToDate"); without it, a runner gets
      # prose and a Mac running an agent gets JSON.
      - name: Push
        working-directory: supabase
        run: |
          supabase db push --dry-run --agent yes --password "$SUPABASE_DB_PASSWORD" > pending.txt 2>&1
          { echo "### Production: the database"; echo "Pending before the push:"; echo '```'; cat pending.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db push --dry-run --agent yes --password "$SUPABASE_DB_PASSWORD" > after.txt 2>&1
          { echo "After the push:"; echo '```'; cat after.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '"upToDate":true' after.txt; then echo "::error::Migrations are still pending after the push."; exit 1; fi

      # The worker's address and secret, read by the database's wakes (pg_cron and the enqueue trigger, D85) from Vault:
      # written here on every deploy, never typed by hand and never in a migration (D11). The file is never printed.
      - name: The worker's secrets
        working-directory: supabase
        env:
          WORKER_URL: ${{ vars.API_ORIGIN }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ] || [ -z "$WORKER_URL" ]; then echo "::warning::WORKER_SECRET or API_ORIGIN is not set; the wakes stay off."; exit 0; fi
          esc() { printf "%s" "$1" | sed "s/'/''/g"; }
          umask 077
          {
            echo "delete from vault.secrets where name in ('worker_url', 'worker_secret');"
            echo "select vault.create_secret('$(esc "$WORKER_URL")', 'worker_url');"
            echo "select vault.create_secret('$(esc "$WORKER_SECRET")', 'worker_secret');"
          } > "$RUNNER_TEMP/vault.sql"
          supabase db query --linked -f "$RUNNER_TEMP/vault.sql" > /dev/null
          rm -f "$RUNNER_TEMP/vault.sql"
          echo "The worker's address and secret are in Vault." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: the API to production
    needs: [gate, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gate's commit: the one the check passed and the migration took.
      - id: commit
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          git checkout -q "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      # Built here, not on Vercel: production's variables (SUPABASE_URL, SUPABASE_ANON_KEY) are read from Vercel.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bun x "$VERCEL_CLI" pull --yes --environment=production
          bun x "$VERCEL_CLI" build --prod

      # Hobby's ceiling (D85): the worker's 200 s budget leaves a step room under it. The Hono builder honours only the
      # "**/*" pattern in vercel.json (session 35); a build without it would cut a step at the default.
      - name: The function's time
        run: |
          configs=$(find .vercel/output/functions -name .vc-config.json)
          if [ -z "$configs" ]; then echo "::error::The build made no function."; exit 1; fi
          for f in $configs; do
            if ! jq -e '.maxDuration == 300' "$f" > /dev/null; then echo "::error::$f has no maxDuration of 300."; exit 1; fi
          done
          echo "maxDuration 300 on: $configs"
          # The PDFs (D89): the Typst module built for Vercel's Linux and the committed fonts go with the function.
          for f in $configs; do
            dir=$(dirname "$f")
            if ! find -L "$dir" -name '*.node' -path '*typst-ts-node-compiler-linux-x64-gnu*' | grep -q .; then echo "::error::$dir has no Typst module for linux-x64-gnu."; exit 1; fi
            if ! find -L "$dir" -path '*fonts/NotoSans-Regular.ttf' | grep -q .; then echo "::error::$dir has no fonts/NotoSans-Regular.ttf."; exit 1; fi
          done
          echo "the Typst module and the fonts are with the function"

      # The deployment production served before this one is written down: promoting it back is the rollback.
      # Vercel holds a deployment whose commit author it does not know at UNKNOWN for ever (only arunkpatra@gmail.com
      # deploys); the limit turns that into a failure in minutes.
      - name: Deploy
        timeout-minutes: 5
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          domain="${SITE#https://}"
          previous=$(bun x "$VERCEL_CLI" inspect "$domain" 2>&1 | awk '$1 == "url" { print $2; exit }' || true)
          # Off a terminal the CLI answers in JSON; the deployment's URL is in it.
          out=$(bun x "$VERCEL_CLI" deploy --prebuilt --prod --env TC_COMMIT="$COMMIT")
          url=$(jq -r '.deployment.url // empty' <<< "$out" 2>/dev/null || true)
          url="${url:-$out}"
          {
            echo "### Production: the API"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Deployment | $url |"
            echo "| Served at | $SITE |"
            if [ -n "$previous" ]; then
              echo ""
              echo "Roll back: \`vercel promote $previous --scope aruns-projects-abe1e969\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # With the smoke account it signs in and makes one real `check` for the smoke centre (D80); the key smoke-<commit>
      # makes a re-run for the same commit free.
      - name: Smoke
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SMOKE_CENTRE_ID: ${{ vars.SMOKE_CENTRE_ID }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          # With it the smoke wakes the worker (GET /jobs/tick): the route, the service key and the secret proven.
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          status=0
          bun tools/smoke.ts "$SITE" --commit "$COMMIT" > smoke.txt 2>&1 || status=$?
          cat smoke.txt
          { echo "### The smoke"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error::The smoke of $SITE failed. Roll back with the command in this run's summary."
          fi
          exit "$status"
