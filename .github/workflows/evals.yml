name: evals

# The golden sets of the kinds asked (D74, D101), on the real models, graded by Opus 5.5: run by hand alone (D112: no
# automation spends on AI calls). The person running it names the kinds; `bun evals --kinds a,b` locally does the same.
# The repository secret ANTHROPIC_API_KEY is set by the session from api/.env.local (D87). Every action is pinned to a
# commit (D14); the tag it was is in the comment.
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "The kinds to run, comma-separated (for example sheet,check)"
        required: true
        type: string

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: the kinds' evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KINDS: ${{ inputs.kinds }}
        run: |
          set -o pipefail
          bun evals --kinds "$KINDS" 2>&1 | tee evals.log
          grep '^|' evals.log >> "$GITHUB_STEP_SUMMARY" || true
