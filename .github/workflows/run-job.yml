name: run-job

# One plan job by hand (plan decision 21): the owner's centre found by his email, the batch by its name, the day (empty:
# tomorrow in India). Queued in the database (its insert wakes the worker, 0034), the worker woken once more, and the
# job's state polled for three minutes into the run's summary: the plan's id, never a student's name. The email is
# typed here and masked in the log, never written to the repository (D55). Phase 18's schedules replace it for the
# plan; it stays for support.

run-name: run a plan job

on:
  workflow_dispatch:
    inputs:
      email:
        description: The centre owner's email
        required: true
      batch:
        description: The batch's name, as the app shows it
        required: true
      date:
        description: The day, YYYY-MM-DD (empty, tomorrow in India)
        required: false
        default: ""

concurrency:
  group: run-job
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: the plan job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      SITE: ${{ vars.API_ORIGIN }}
      PROJECT_REF: esowihbxawvoexflekxa
      EMAIL: ${{ inputs.email }}
      BATCH: ${{ inputs.batch }}
      DAY: ${{ inputs.date }}
    steps:
      - name: Mask the email
        run: echo "::add-mask::$EMAIL"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      # The inputs are checked by the script before any SQL is written; they reach it through the environment.
      - name: The SQL
        run: bun tools/run-job.ts --email "$EMAIL" --batch "$BATCH" --date "$DAY" --out "$RUNNER_TEMP/job.sql" --poll-out "$RUNNER_TEMP/poll.sql"

      - name: Link
        working-directory: supabase
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Queue
        working-directory: supabase
        run: supabase db query --linked -f "$RUNNER_TEMP/job.sql"

      - name: Wake the worker
        run: curl -fsS -H "Authorization: Bearer $WORKER_SECRET" "$SITE/jobs/tick"

      - name: The job
        working-directory: supabase
        run: |
          state=""
          for i in $(seq 1 12); do
            supabase db query --linked -f "$RUNNER_TEMP/poll.sql" --output-format json > poll.json
            state=$(jq -r '(if type == "array" then . else .rows end)[0].state // empty' poll.json 2>/dev/null || true)
            if [ "$state" = "done" ] || [ "$state" = "failed" ] || [ "$state" = "cancelled" ]; then break; fi
            sleep 15
          done
          { echo "### The plan job"; echo '```'; cat poll.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat poll.json
          if [ "$state" != "done" ]; then echo "::error::The job is $state after three minutes."; exit 1; fi
