name: seed-review

# App Review's demo centre (D51), started by hand once the owner has made the account in the app (signed in with the
# email, finished the setup screen, set a password). Fills that account's centre with a sample centre: two classes, ten
# students, this month's fees, four weeks of attendance, an event and two tasks, dated from the day it runs. Refuses a
# centre that already has students, so no real tutor's centre is touched. Every parent gets the one number given, a
# number the owner holds. The SQL is `tools/review-seed.ts`, tested on the local database by
# `supabase/tests/review-seed.test.ts`.

run-name: seed the review centre of ${{ inputs.email }}

on:
  workflow_dispatch:
    inputs:
      email:
        description: The review account's email (the account must exist and have finished setup)
        required: true
      parent_phone:
        description: The one number every parent gets, one the owner holds (+91 and ten digits)
        required: true

concurrency:
  group: seed-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: the review centre
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: esowihbxawvoexflekxa
      EMAIL: ${{ inputs.email }}
      PARENT_PHONE: ${{ inputs.parent_phone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      # The inputs are checked by the script before any SQL is written; they reach it through the environment.
      - name: The SQL
        run: bun tools/review-seed.ts --email "$EMAIL" --parent-phone "$PARENT_PHONE" --out "$RUNNER_TEMP/review-seed.sql"

      - name: Link
        working-directory: supabase
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Seed
        working-directory: supabase
        run: |
          supabase db query --linked -f "$RUNNER_TEMP/review-seed.sql"
          { echo "### The review centre"; echo "Seeded the centre of \`$EMAIL\`: 2 classes, 10 students, this month's fees (6 paid), four weeks of attendance, a parents' meeting, 2 tasks."; } >> "$GITHUB_STEP_SUMMARY"
