<!doctype html>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FB2FF}a:hover{color:#B3CAFF}

<div style="--bg:#141516; --s1:#1D1F21; --line2:#3F4347; --t:#F5F5F3; --t2:#B0B4B7; --t3:#82878B; --accFill:#4F83FF; --accText:#8FB2FF; --accInk:#061433; --serif:'Instrument Serif', 'New York', Georgia, serif; width: 393px; height: 852px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--t); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 15px; line-height: 20px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; padding: 80px 24px 54px">

  <div style="display: flex; align-items: center; gap: 14px">
    <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px; background: var(--t); color: var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 34px; line-height: 1; font-style: italic">t</div>
    <div style="font-family: var(--serif); font-size: 22px; line-height: 24px">Tutor Central</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 64px">
    <h1 style="margin: 0; font-family: var(--serif); font-size: 54px; line-height: 54px; font-weight: 400; letter-spacing: -0.015em; text-wrap: balance">Teach more.<br><em style="font-style: italic; color: var(--accText)">Chase</em> less.</h1>
    <p style="margin: 0; font-size: 18px; line-height: 26px; color: var(--t2); max-width: 320px; text-wrap: pretty">Students, fees and attendance for your tuition centre, handled in a tap.</p>
  </div>

  <div style="flex: 1"></div>

  <div aria-hidden="true" style="height: 1px; background: var(--line2); margin-bottom: 20px"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 52px; border: 0; border-radius: 12px; background: #FFFFFF; color: #111111; font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; box-shadow: 0 1px 2px rgba(0,0,0,.4)">
      <span aria-hidden="true" style="font-size: 20px; line-height: 20px; position: relative; top: -1px"></span>
      Continue with Apple
    </button>
    <button style="height: 52px; border: 1px solid var(--line2); border-radius: 12px; background: var(--s1); color: var(--t); font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.4)">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--t2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--t2)">G</span>
      Continue with Google
    </button>
    <button style="height: 52px; border: 1px solid var(--line2); border-radius: 12px; background: var(--s1); color: var(--t); font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.4)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>
      Continue with email
    </button>
    <p style="margin: 14px 0 0; text-align: center; font-size: 12px; line-height: 16px; color: var(--t3); text-wrap: pretty">By continuing you agree to the <a href="#terms" style="color: var(--t2); text-decoration: none; font-weight: 600">terms</a> and <a href="#privacy" style="color: var(--t2); text-decoration: none; font-weight: 600">privacy policy</a>.</p>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 129px; bottom: 9px; width: 135px; height: 5px; border-radius: 3px; background: var(--t); opacity: .5"></div>
</div>
</x-dc>
