<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 2, sign in with a password, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFAB38}a:hover{color:#FFC164}
</style>
</helmet>
<div style="--bg:#131110; --s1:#1C1917; --s2:#272220; --btn2:#272220; --well:#0E0C0B; --line:#302A27; --line2:#3D3632; --t:#F6F1EA; --t2:#B9AFA5; --t3:#958B80; --acc:#FFAB38; --accText:#FFAB38; --accInk:#221400; --over:#FF6F61; --shadowWell:inset 0 1px 3px rgba(0,0,0,.6); --halo:0 0 0 3px rgba(255,171,56,.18); --glow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 22px rgba(255,171,56,.28); --shadowFloat:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); --dim:rgba(8,6,5,.6); width: 393px; height: 852px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(460px 380px at 90% -8%, rgba(255,171,56,.18), transparent 70%), var(--bg); color: var(--t); font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif; font-size: 15px; line-height: 20px; -webkit-font-smoothing: antialiased">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 80px 24px 0; opacity: .5">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: var(--acc)"></div>
      <div style="font-size: 17px; font-weight: 700">Tutor Central</div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--dim)"></div>

  <div style="position: absolute; left: 20px; right: 20px; top: 170px; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--s1); border: 1px solid var(--line); border-radius: 16px">
    <div style="font-size: 13px; line-height: 18px; color: var(--t2)">State: wrong password (drawn above the sheet on this board so both are on one picture)</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw-wrong" style="font-size: 13px; color: var(--t2)">Password</label>
      <input id="pw-wrong" type="password" value="wrongone" style="height: 46px; box-sizing: border-box; border: 1px solid var(--over); border-radius: 15px; background: var(--well); color: var(--t); font: inherit; font-size: 17px; padding: 0 14px; outline: none; box-shadow: var(--shadowWell)">
      <div style="display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 18px; color: var(--over)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>That password isn't right. If you never set one, sign in with a code instead.</div>
    </div>
  </div>

  <div role="dialog" aria-labelledby="pw-title" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 50px; background: var(--s1); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: var(--shadowFloat)">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: var(--line2); margin: 0 auto"></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
      <button style="border: 0; background: transparent; color: var(--accText); font: inherit; font-size: 15px; font-weight: 600; padding: 0; text-align: left">Cancel</button>
      <div id="pw-title" style="font-size: 17px; font-weight: 700">Sign in with password</div>
      <div></div>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 20px; color: var(--t2); text-wrap: pretty">For an account that set a password in Settings. Otherwise a code is quicker.</p>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw-email" style="font-size: 13px; color: var(--t2)">Email address</label>
      <input id="pw-email" type="email" inputmode="email" autocomplete="username" value="meera.nair@gmail.com" style="height: 46px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 15px; background: var(--well); color: var(--t); font: inherit; font-size: 17px; padding: 0 14px; outline: none; box-shadow: var(--shadowWell)">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw-password" style="font-size: 13px; color: var(--t2)">Password</label>
      <input id="pw-password" type="password" autocomplete="current-password" value="correcthorse" style="height: 46px; box-sizing: border-box; border: 1px solid var(--acc); border-radius: 15px; background: var(--well); color: var(--t); font: inherit; font-size: 17px; padding: 0 14px; outline: none; box-shadow: var(--shadowWell), var(--halo)">
    </div>
    <button style="height: 52px; border: 0; border-radius: 15px; background: var(--acc); color: var(--accInk); font: inherit; font-size: 16px; font-weight: 700; box-shadow: var(--glow); padding: 0 16px">Sign in</button>
    <button style="height: 44px; border: 0; border-radius: 15px; background: transparent; color: var(--accText); font: inherit; font-size: 15px; font-weight: 600; padding: 0 16px">Email me a code instead</button>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 129px; bottom: 9px; width: 135px; height: 5px; border-radius: 3px; background: var(--t); opacity: .5"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
