name: TutorCentral
options:
  bundleIdPrefix: in.tutorcentral
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TutorCentralKit:
    path: TutorCentralKit
targets:
  TutorCentral:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TutorCentralKit
        product: AppShell
      - target: TutorCentralShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tutorcentral.app
        # iPhone only (D1). XcodeGen gives an application target "1,2", which beats the project-level setting.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TutorCentral.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # "Share to Tutor Central" (docs/spec-v2.md section 9): its own App ID, the app group shared with the app. No package
  # dependency: it writes one file the app reads, from Phase 13. Embedded from Phase 10 so cloud signing is proven early
  # (the owner, 2026-10-10).
  TutorCentralShare:
    type: app-extension
    platform: iOS
    sources: [Share]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tutorcentral.app.share
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/TutorCentralShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
  TutorCentralSmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmokeTests]
    dependencies:
      - target: TutorCentral
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tutorcentral.app.smoketests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TutorCentral.app/TutorCentral
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  TutorCentral:
    build:
      targets:
        TutorCentral: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TutorCentralSmokeTests
        - package: TutorCentralKit/DesignSystemTests
        - package: TutorCentralKit/DomainTests
        - package: TutorCentralKit/DataTests
        - package: TutorCentralKit/AppShellTests
        - package: TutorCentralKit/OnboardingTests
        - package: TutorCentralKit/TodayTests
        - package: TutorCentralKit/AttendanceTests
        - package: TutorCentralKit/ScheduleTests
        - package: TutorCentralKit/FeesTests
        - package: TutorCentralKit/StudentsTests
        - package: TutorCentralKit/SettingsTests
        - package: TutorCentralKit/AIToolsTests
        - package: TutorCentralKit/ArtefactsTests
  TutorCentral Kit:
    build:
      targets:
        TutorCentral: all
    run:
      config: Debug
      commandLineArguments:
        "--state kit": true
